modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies."${mod_id}"]]
modId = "forge"
mandatory = true
versionRange = "${forge_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "reverie_core"
mandatory = true
versionRange = "[0.1,)"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "geckolib"
mandatory = true
versionRange = "${geckolib_version_range}"
ordering = "NONE"
side = "BOTH"

# 帕秋莉：可选；厨房条目写入核心那本总手册。
[[dependencies."${mod_id}"]]
modId = "patchouli"
mandatory = false
versionRange = "[1.20.1,)"
ordering = "AFTER"
side = "BOTH"

[[mixins]]
config = "dream_eatery.mixins.json"
