plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.78'
    id 'idea'
}

apply from: rootProject.file('../gradle/prepare-neoforge-content-sources.gradle')
apply from: rootProject.file('../gradle/shared-neoforge-mod.gradle')

dependencies {
    implementation project(':reverie_core')
    annotationProcessor project(':reverie_core')
    localRuntime "vazkii.patchouli:Patchouli:${patchouli_version}"
    localRuntime "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

afterEvaluate {
    tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
        dependsOn ':reverie_core:jar'
    }
}
