plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.+'
}

apply from: rootProject.file('../gradle/shared-forge-mod.gradle')

minecraft {
    runs {
        client {
            args '--mixin.config=dream_eatery.mixins.json', '--mixin.config=reverie_core.mixins.json'
        }

        server {
            args '--nogui', '--mixin.config=dream_eatery.mixins.json', '--mixin.config=reverie_core.mixins.json'
        }
    }
}

dependencies {
    // 排除核心传递的已映射 JEI/Patchouli 坐标，再在本工程 fg.deobf（仓库见 shared-forge-mod BlameJared）
    implementation(project(':reverie_core')) {
        exclude group: 'mezz.jei'
        exclude group: 'vazkii.patchouli'
    }
    annotationProcessor project(':reverie_core')
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    runtimeOnly fg.deobf("vazkii.patchouli:Patchouli:${patchouli_version}")
}

tasks.named('jar', Jar).configure {
    finalizedBy 'reobfJar'
}

mixin {
    add sourceSets.main, 'dream_eatery.refmap.json'
}

afterEvaluate {
    def rcJarPath = ':reverie_core:jar'
    tasks.matching { it.name in ['prepareRunClient', 'runClient', 'prepareRunServer', 'runServer'] }
            .configureEach { dependsOn(rcJarPath) }
}
